name: Desktop source CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-regression:
    name: Desktop build and regression
    # The helper targets arm64 and the native tests execute that helper.
    # The first macos-15 image lacked the required Chinese sentence model.
    # Keep the native capability assertion; validate on the current stable image.
    # This runner selection is not a claim about the minimum supported macOS.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Check out the CI revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: arm64
          package-manager-cache: false
      - name: Verify the native test platform
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('Desktop native tests require macOS arm64'); console.log(process.version, process.platform, process.arch)"
      - name: Install root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install workbench dependencies
        run: npm ci --prefix prototypes/desktop-workbench --ignore-scripts --no-audit --no-fund
      - name: Build and verify desktop resources
        run: npm run desktop:build
      - name: Run desktop regression tests
        run: npm run test:desktop
